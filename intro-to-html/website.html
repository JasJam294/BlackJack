<!DOCTYPE html>
<html>

<head>
  <title>First Website</title>
  <style>
    .amazon-link {
      color: rgb(0, 113, 133);
    }

    .amazon-link:hover {
      color: pink;
    }

    .stock-p {
      color: rgb(0, 118, 0);
    }

    .add-button {
      background-color: rgb(255, 216, 20);
      color: black;
      border: none;
      height: 30px;
      width: 120px;
      border-radius: 20px;
      margin-right: 8px;
      cursor: pointer;
    }

    .add-button:hover {
      background-color: rgb(223, 164, 1);
    }

    .add-button:active {
      opacity: 0.8;
    }


    .buy-button {
      background-color: rgb(255, 164, 28);
      color: black;
      border: none;
      height: 30px;
      width: 120px;
      border-radius: 20px;
      cursor: pointer;
      transition: opacity0.15s;
    }

    .buy-button:hover {
      opacity: 0.7;
    }


    .pfp {
      width: 200px;
      display: inline-block;
    }

    .chikawaimg {
      width: 200px;
      height: 200px;
      object-fit: cover;
      object-position: center;
      margin-right: 15px;
      margin-top: 50px;
    }

    .google-search {
      font-size: 15px;
      width: 300px;
      margin-top: 20px;
      padding-top: 5px;
      padding-bottom: 5px;
      padding-left: 5px;
      padding-right: 5px;
      border-radius: 10px;
      border: none;
      box-shadow: 0px 1px 5px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>

<body>
  <a class="amazon-link"
    href="https://www.amazon.com/Warehouse-Deals/b?ie=UTF8&node=10158976011&tag=mh0b-20&hvadid=77859253317687&hvqmt=b&hvbmt=bb&hvdev=c&ref=pd_sl_4t3l9xvjf4_b"
    target="_blank">
    Back to Amazon
  </a>

  <h2 class="product-title">
    Nike Black Running Shoes
  </h2>

  <p class="stock-p">
    $39 - in stock.
  </p>

  <p>
    Free delivery tomorrow.
  </p>

  <button class="add-button">
    Add to Cart
  </button>

  <button class="buy-button">
    Buy now
  </button>

  <input class="google-search" type="text" placeholder="Search Google or type a URL" <div class="pfp">
  <img class="chikawaimg" src="chiikawajpeg.jpg">
  <p class="name">
    Jasmine
  </p>
  <p class="mutual-friends">
    5 mutual friends
  </p>
  <button class="'add-friend-button">
    Add Friend
  </button>
  </div>
</body>

</html>
